name: Build MarcoTV Touch Edition

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix gradlew line endings and permissions
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build with Gradle (Skip Lint & Tests)
        run: ./gradlew assembleDebug --stacktrace -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MarcoTV-Touch-Debug
          path: app/build/outputs/apk/debug/*.apk
