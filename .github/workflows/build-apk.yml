name: Build MarcoTV Touch Edition

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: List Repository Files (Diagnostic)
        run: |
          echo "=== Root Directory ==="
          ls -la
          echo "=== Subdirectories ==="
          ls -R | head -n 50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Smart Build with Gradle
        run: |
          if [ -f "gradlew" ]; then
            echo "Found gradlew at root."
            sed -i -e 's/\r$//' gradlew
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace -x lint -x test
          elif [ -f "android/gradlew" ]; then
            echo "Found gradlew in android/ folder. This might be a Flutter/React Native project."
            cd android
            sed -i -e 's/\r$//' gradlew
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace -x lint -x test
          else
            echo "No gradlew found! Attempting to use system gradle..."
            gradle assembleDebug --stacktrace -x lint -x test
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarcoTV-Touch-Debug
          path: |
            app/build/outputs/apk/**/*.apk
            android/app/build/outputs/apk/**/*.apk
            build/app/outputs/apk/**/*.apk
