name: Build MarcoTV Touch Edition

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix gradlew permissions
        run: |
          if [ -f "gradlew" ]; then
            sed -i -e 's/\r$//' gradlew
            chmod +x gradlew
          else
            echo "gradlew not found. Will use system gradle."
          fi

      - name: Build App Module
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace -x lint -x test
          else
            gradle :app:assembleDebug --stacktrace -x lint -x test
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarcoTV-Touch-Debug
          path: |
            app/build/outputs/apk/**/*.apk
